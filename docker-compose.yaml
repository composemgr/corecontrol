# nginx proxy address - http://172.17.0.1:59022

name: corecontrol
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: haedlessdev/corecontrol:latest
    container_name: corecontrol-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      JWT_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DATABASE_URL: postgresql://${DB_ADMIN_NAME:-postgres}:${DB_ADMIN_PASS:-changeme_admin_password}@corecontrol-db:5432/${DB_CREATE_DATABASE_NAME:-corecontrol}
    ports:
      - '172.17.0.1:59022:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_started
    networks:
      - corecontrol

  agent:
    image: haedlessdev/corecontrol-agent:latest
    container_name: corecontrol-agent
    hostname: corecontrol-agent
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://${DB_ADMIN_NAME:-postgres}:${DB_ADMIN_PASS:-changeme_admin_password}@corecontrol-db:5432/${DB_CREATE_DATABASE_NAME:-corecontrol}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - corecontrol

  db:
    image: postgres:latest
    container_name: corecontrol-db
    hostname: corecontrol-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-corecontrol}
      POSTGRES_USER: ${DB_ADMIN_NAME:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - './volumes/data/db/postgres/corecontrol:/var/lib/postgresql/data:rw'
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-U', '${DB_ADMIN_NAME:-postgres}', '-d', '${DB_CREATE_DATABASE_NAME:-corecontrol}']
      timeout: 45s
      interval: 10s
      retries: 10
    networks:
      - corecontrol

networks:
  corecontrol:
    name: corecontrol
    external: false
